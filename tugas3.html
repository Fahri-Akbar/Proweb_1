<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas HTML + JS</title>
</head>

<body>
    <table>
        <tr>
            <td>
                <label for="bil1">Bilangan 1</label>
            </td>
            <td>
                <input type="number" name="bil1" id="bil1" required>
            </td>
        </tr>
        <tr>
            <td>
                <label for="bil2">Bilangan 2</label>
            </td>
            <td>
                <input type="number" name="bil2" id="bil2" required>
            </td>
        </tr>
        <tr>
            <td></td>
            <td>
                <button onclick="tambah()">+</button>
                <button onclick="kurang()">-</button>
                <button onclick="kali()">*</button>
                <button onclick="bagi()">/</button>
            </td>
        </tr>
        <tr>
            <td>
                Hasil
            </td>
            <td>
                <input type="number" name="hasil" id="hasil" disabled>
            </td>
        </tr>
    </table>

    <script src="script.js"></script>
</body>

</html>
